<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lowe's Final Test — Portal Selector</title>
<style>
  :root {
    --bg:        #EDEAE3;
    --surface:   #F7F5F0;
    --panel:     #FFFFFF;
    --border:    #C8C5BC;
    --border-md: #A8A49B;
    --text:      #1C1B18;
    --text-muted:#706E68;
    --text-dim:  #9B9891;
    --green:     #2A7A4B;
    --green-bg:  #DFF2E8;
    --red:       #B03030;
    --red-bg:    #FDEAEA;
    --amber:     #8A5A00;
    --amber-bg:  #FFF0CC;
    --blue:      #1A5FA8;
    --blue-bg:   #E8F0FB;
    --ui:        system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui);
    padding: 24px;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
    text-align: center;
    letter-spacing: -0.01em;
  }
  p.sub {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 32px;
  }
  .card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 16px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    border-color: var(--blue);
    box-shadow: 0 2px 10px rgba(26, 95, 168, 0.12);
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--blue);
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .badge-standard {
    background: var(--blue-bg);
    color: var(--blue);
  }
  .badge-custom {
    background: var(--amber-bg);
    color: var(--amber);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Lowe's Final Test</h1>
    <p class="sub">Choose which portal to open</p>

    <a class="card" href="prod-workflow-final.html">
      <div class="card-title">Standard Portal <span class="badge badge-standard">Standard</span></div>
      <div class="card-desc">Sequential step-by-step workflow with Tester/SO gating and standard button behavior.</div>
    </a>

    <a class="card" href="prod-workflow-customized.html">
      <div class="card-title">Customized Portal <span class="badge badge-custom">Customized</span></div>
      <div class="card-desc">All step cards accessible at once, no Close Doors step, no Tester/SO requirement, buttons always active.</div>
    </a>
  </div>
</body>
</html>
